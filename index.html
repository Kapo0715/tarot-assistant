<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みかづき鑑定室｜鑑定アシスタント</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FBF3EF;
    --surface: #F3E3DC;
    --surface2: #ECD8CC;
    --text: #4A332C;
    --muted: #A38A82;
    --accent: #C99A8C;
    --accent-h: #B98572;
    --accent-l: #C99A8C;
    --border: #E3C9BD;
    --danger: #C0392B;
    --warn-bg: #FFF7DA;
    --warn-text: #7A5B00;
    --ok: #2E7D46;
  }

  body.theme-kuroi {
    --bg: #101024;
    --surface: #181832;
    --surface2: #20203c;
    --text: #EDEDF7;
    --muted: #8686a8;
    --accent: #9B9BD0;
    --accent-h: #8484c2;
    --accent-l: #B7B7E3;
    --border: #2c2c4a;
    --danger: #e8746a;
    --warn-bg: #2c2510;
    --warn-text: #e8cf7a;
    --ok: #6fce8e;
  }

  body.theme-shiori {
    --bg: #F2F9FA;
    --surface: #E7F3F5;
    --surface2: #D9EBEE;
    --text: #2E4A4F;
    --muted: #7FA6AC;
    --accent: #8FBFC9;
    --accent-h: #79AEB9;
    --accent-l: #6FA3AE;
    --border: #CFE6E9;
    --danger: #C0392B;
    --warn-bg: #FFF2CF;
    --warn-text: #6b5100;
    --ok: #2E7D46;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    padding: 16px 16px 56px;
    max-width: 560px;
    margin: 0 auto;
    transition: background 0.2s, color 0.2s;
  }

  h1, h2, .serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .header-title { text-align: center; flex: 1; }
  header h1 { font-size: 1.1rem; color: var(--accent-h); letter-spacing: 0.06em; }
  header p { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .settings-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); width: 38px; height: 38px; font-size: 1.1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s; flex-shrink: 0;
  }
  .settings-btn:hover, .settings-btn.has-key { border-color: var(--accent); color: var(--accent-h); }
  .header-spacer { width: 38px; flex-shrink: 0; }
  .version-tag { font-size: 0.6rem; color: var(--muted); }

  section { margin-bottom: 24px; }
  .label {
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 0.6rem; flex-shrink: 0;
  }

  /* ── Account tabs ── */
  .account-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .account-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); padding: 12px 4px; text-align: center; cursor: pointer;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .account-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .account-btn .acc-name { display: block; font-family: "Hiragino Mincho ProN","Yu Mincho",serif; font-size: 0.92rem; font-weight: 700; }
  .account-btn .acc-sub { display: block; font-size: 0.58rem; margin-top: 3px; opacity: 0.85; line-height: 1.3; }

  /* ── Plan buttons ── */
  .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .plan-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 12px 6px; text-align: center; cursor: pointer;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .plan-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .plan-btn .plan-name { display: block; font-weight: 700; font-size: 0.85rem; }
  .plan-btn .plan-price { display: block; font-size: 0.72rem; margin-top: 3px; opacity: 0.85; }
  .plan-btn .plan-target { display: block; font-size: 0.62rem; margin-top: 2px; opacity: 0.7; }

  .items-preview {
    margin-top: 10px; font-size: 0.76rem; color: var(--muted); line-height: 1.8;
    background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px;
  }

  /* ── Textarea ── */
  textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 0.9rem; line-height: 1.7;
    padding: 14px; resize: vertical; min-height: 110px; outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* ── Mode toggle ── */
  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 10px; }
  .mode-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-size: 0.82rem; padding: 10px; cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn.selected { background: var(--surface); border-color: var(--accent); color: var(--accent-h); font-weight: 700; }
  .mode-btn .badge {
    display: inline-block; font-size: 0.58rem; background: var(--accent); color: #fff;
    border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: middle;
  }

  /* ── Generate button ── */
  .generate-btn {
    width: 100%; background: var(--accent); border: none; border-radius: 12px; color: #fff;
    font-family: inherit; font-size: 1rem; font-weight: 700; padding: 16px; min-height: 54px;
    cursor: pointer; transition: background 0.15s; letter-spacing: 0.03em;
  }
  .generate-btn:hover { background: var(--accent-h); }
  .generate-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }
  .generate-btn.loading { background: var(--accent-h); cursor: wait; }

  .no-key-warn { font-size: 0.76rem; color: var(--muted); text-align: center; margin-top: 8px; display: none; }
  .no-key-warn a { color: var(--accent-h); cursor: pointer; text-decoration: underline; }

  /* ── Output ── */
  .output-area { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px 16px; display: none; animation: fadeIn 0.3s ease; }
  .output-area.visible { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .output-badge {
    font-size: 0.65rem; color: var(--accent-h); letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .output-badge::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .output-mode-tag { font-size: 0.6rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--muted); margin-left: 4px; }
  .edit-hint { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; }

  .output-textarea {
    font-size: 0.92rem; line-height: 1.85; min-height: 340px; margin-bottom: 8px;
    background: var(--bg);
  }

  .char-counter { font-size: 0.76rem; text-align: right; margin-bottom: 10px; font-weight: 700; }
  .char-counter.counter-ok { color: var(--ok); }
  .char-counter.counter-bad { color: var(--danger); }

  .warn-banner { border-radius: 8px; padding: 10px 12px; font-size: 0.78rem; line-height: 1.6; margin-bottom: 10px; }
  .warn-danger { background: rgba(192,57,43,0.1); border: 1px solid var(--danger); color: var(--danger); }
  .warn-caution { background: var(--warn-bg); border: 1px solid var(--warn-text); color: var(--warn-text); }

  .continue-btn {
    width: 100%; background: transparent; border: 1px dashed var(--accent); border-radius: 10px;
    color: var(--accent-h); font-size: 0.85rem; padding: 12px; cursor: pointer; margin-bottom: 10px;
    transition: background 0.15s;
  }
  .continue-btn:hover { background: rgba(0,0,0,0.03); }
  .continue-btn:disabled { opacity: 0.5; cursor: wait; }

  .output-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .copy-btn {
    background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: inherit;
    font-size: 0.9rem; padding: 13px; cursor: pointer; transition: background 0.15s;
  }
  .copy-btn:hover { background: var(--accent-h); }
  .reset-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
    font-family: inherit; font-size: 0.9rem; padding: 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: var(--muted); color: var(--text); }

  .copy-msg { text-align: center; font-size: 0.78rem; color: var(--ok); min-height: 22px; margin-top: 10px; transition: opacity 0.3s; }
  .copy-msg.hidden { opacity: 0; }

  /* ── Settings modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end;
    justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface); border-radius: 16px 16px 0 0; padding: 24px 20px 40px; width: 100%;
    max-width: 560px; transform: translateY(20px); transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-family: "Hiragino Mincho ProN","Yu Mincho",serif; font-size: 1rem; color: var(--accent-h); }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
  .modal-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.05em; }
  .modal-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 0.88rem; padding: 12px 14px; outline: none;
    transition: border-color 0.2s; margin-bottom: 8px;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-hint { font-size: 0.7rem; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .modal-hint a { color: var(--accent-h); }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-save { background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.9rem; padding: 13px; cursor: pointer; }
  .modal-clear { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: inherit; font-size: 0.9rem; padding: 13px; cursor: pointer; }
  .api-status { font-size: 0.72rem; margin-top: 12px; text-align: center; min-height: 20px; }
  .api-status.ok { color: var(--ok); }
  .api-status.err { color: var(--danger); }
</style>
</head>
<body class="theme-kotoha" id="body">

<header>
  <div class="header-spacer"></div>
  <div class="header-title">
    <h1>みかづき鑑定室｜鑑定アシスタント</h1>
    <p>相談文を貼って、鑑定文を下書きするツール</p>
  </div>
  <button class="settings-btn" id="settings-btn" onclick="openSettings()" title="API設定">⚙</button>
</header>

<section>
  <div class="label"><span class="step-num">1</span>アカウントを選ぶ</div>
  <div class="account-tabs">
    <button class="account-btn selected" id="acc-kotoha" onclick="setAccount('kotoha')">
      <span class="acc-name">ことは</span>
      <span class="acc-sub">復縁タロット</span>
    </button>
    <button class="account-btn" id="acc-kuroi" onclick="setAccount('kuroi')">
      <span class="acc-name">黒烏</span>
      <span class="acc-sub">言えない恋のタロット</span>
    </button>
    <button class="account-btn" id="acc-shiori" onclick="setAccount('shiori')">
      <span class="acc-name">栞奈</span>
      <span class="acc-sub">お清め開運</span>
    </button>
  </div>
</section>

<section>
  <div class="label"><span class="step-num">2</span>プランを選ぶ</div>
  <div class="plan-grid">
    <button class="plan-btn selected" id="plan-free" onclick="setPlan('free')">
      <span class="plan-name">無料LINE相談</span>
      <span class="plan-price">無料</span>
      <span class="plan-target">目安300字</span>
    </button>
    <button class="plan-btn" id="plan-lite" onclick="setPlan('lite')">
      <span class="plan-name">お試し</span>
      <span class="plan-price">¥500</span>
      <span class="plan-target">500字以上</span>
    </button>
    <button class="plan-btn" id="plan-main" onclick="setPlan('main')">
      <span class="plan-name">本鑑定</span>
      <span class="plan-price">¥3,000</span>
      <span class="plan-target">1,800字以上</span>
    </button>
    <button class="plan-btn" id="plan-deep" onclick="setPlan('deep')">
      <span class="plan-name">深掘り</span>
      <span class="plan-price">¥5,000</span>
      <span class="plan-target">3,500字以上</span>
    </button>
  </div>
  <div class="items-preview" id="items-preview"></div>
</section>

<section>
  <div class="label"><span class="step-num">3</span>相談文を貼り付ける</div>
  <textarea id="consult-text" placeholder="お客様から届いた相談文をここに貼り付けてください" oninput="updateGenerateBtn()"></textarea>

  <div class="mode-toggle">
    <button class="mode-btn selected" id="mode-template" onclick="setMode('template')">テンプレート</button>
    <button class="mode-btn" id="mode-ai" onclick="setMode('ai')">AI生成 <span class="badge">Gemini</span></button>
  </div>
  <button class="generate-btn" id="generate-btn" onclick="generate()" disabled>鑑定文を作る</button>
  <p class="no-key-warn" id="no-key-warn">APIキーが未設定です。<a onclick="openSettings()">こちらから設定</a>してください。</p>
</section>

<div class="output-area" id="output-area">
  <div class="output-badge">鑑定文 <span class="output-mode-tag" id="output-mode-tag"></span></div>
  <p class="edit-hint">▼ 編集できます。送信前に必ず内容を確認してください。</p>
  <textarea class="output-textarea" id="output-text" oninput="updateCounters()"></textarea>
  <div class="char-counter" id="char-counter"></div>
  <div class="warn-banner warn-danger" id="banned-warning" style="display:none"></div>
  <div class="warn-banner warn-caution" id="url-warning" style="display:none">⚠️ 誘導URLはまだ仮置きです（【　】のまま）。出品後に正しいURLへ差し替えてください。</div>
  <button class="continue-btn" id="continue-btn" style="display:none" onclick="continueWriting()">続きを追記する（AI）</button>
  <div class="output-actions">
    <button class="copy-btn" onclick="copyOutput()">コピー</button>
    <button class="reset-btn" onclick="resetOutput()">作り直す</button>
  </div>
  <div class="copy-msg hidden" id="copy-msg"></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">API設定</span>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-label">Gemini APIキー</div>
    <input class="modal-input" type="password" id="api-key-input" placeholder="AIza..." autocomplete="off">
    <p class="modal-hint">
      端末のブラウザにのみ保存されます。サーバーには送信されません。<br>
      APIキーは <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> で無料取得できます。
    </p>
    <div class="modal-actions">
      <button class="modal-save" onclick="saveApiKey()">保存</button>
      <button class="modal-clear" onclick="clearApiKey()">削除</button>
    </div>
    <div class="api-status" id="api-status"></div>
  </div>
</div>

<script>
const CONFIG = {
  VERSION: '1.0.0',
  GEMINI_MODEL: 'gemini-flash-latest',
  URLS: {
    TO_MAIN: '【本鑑定URL（出品後に差し替え）】',
    TO_DEEP: '【深掘りURL（出品後に差し替え）】'
  }
};

const BANNED_WORDS = ['絶対', '必ず', '100%', '確実'];

const PLANS = {
  free: { key: 'free', label: '無料LINE相談', price: '無料', target: 300, approx: true },
  lite: { key: 'lite', label: 'お試し', price: '¥500', target: 500 },
  main: { key: 'main', label: '本鑑定', price: '¥3,000', target: 1800 },
  deep: { key: 'deep', label: '深掘り', price: '¥5,000', target: 3500 }
};

// ── 大アルカナ22枚（正逆・関係性文脈の汎用解釈） ──
const CARDS = [
  { id: 0, name: '愚者', upright: '新しい一歩を踏み出す軽やかなエネルギー。まだ形になっていなくても、気持ちが動き出しているサインです。', reversed: '勢いだけで動くと空回りしやすい時期。もう少し状況を見極めてからでも遅くありません。' },
  { id: 1, name: '魔術師', upright: '気持ちも状況も、動き出す準備が整いつつある時期。行動に移すことで流れが変わりやすいサインです。', reversed: '気持ちと行動がちぐはぐになりやすい時期。焦らず、今できることから整理していく方が良さそうです。' },
  { id: 2, name: '女教皇', upright: '言葉より、直感や静かな気配で伝わるものが多い時期。焦らず内側の声に耳を傾けたいところです。', reversed: '情報や噂に振り回されて、気持ちが定まりにくい状態。一度距離を置いて心を静めることが助けになりそうです。' },
  { id: 3, name: '女帝', upright: '自分の魅力や価値を素直に受け止めていい時期。無理に取り繕わなくても、あるがままで十分伝わります。', reversed: '自分を後回しにしすぎて、心が満たされにくい状態。まずは自分を大切にすることから始めたいところです。' },
  { id: 4, name: '皇帝', upright: '感情に流されず、落ち着いて状況を見極める力が求められる時期。冷静さが道を開く鍵になりそうです。', reversed: '「こうあるべき」という思い込みが、心を窮屈にしている可能性があります。少し力を抜いてもいいのかもしれません。' },
  { id: 5, name: '法王', upright: 'これまでのやり方や周囲の助言が、意外と的を射ている時期。信頼できる声に耳を傾けてみてください。', reversed: '常識や世間体にとらわれすぎて、本当の気持ちが見えにくくなっている状態です。' },
  { id: 6, name: '恋人', upright: '心が強く動く選択の時期。損得よりも、気持ちが向く方向を大切にしていいサインです。', reversed: '気持ちと行動がすれ違い、迷いが生まれやすい時期。無理に結論を急がなくても大丈夫です。' },
  { id: 7, name: '戦車', upright: '前に進む意志が強まっている時期。迷いを抱えながらも、動き出す力は十分にあります。', reversed: '気持ちばかりが先走り、空回りしやすい状態。一度立ち止まって方向を定めることが助けになりそうです。' },
  { id: 8, name: '力', upright: '静かな忍耐と優しさが、状況を良い方向に導く時期。すぐに結果が出なくても、その力は本物です。', reversed: '我慢や無理を重ねて、心が疲れやすい状態。少し肩の力を抜いてもいい時期かもしれません。' },
  { id: 9, name: '隠者', upright: 'ひとりで気持ちを整理する時間が必要な時期。焦らず、静かに内側と向き合うことが助けになります。', reversed: '一人で抱え込みすぎて、視野が狭くなっている状態。信頼できる誰かに話してみるのも良さそうです。' },

// ── Utility ──
function extractQuote(text) {
  if (!text) return '今回のご相談';
  const clean = text.replace(/\s+/g, ' ').trim();
  const parts = clean.split(/[。！？\n]/).filter(Boolean);
  let q = parts[0] || clean;
  if (q.length > 40) q = q.slice(0, 40) + '…';
  return q || '今回のご相談';
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function drawCards(n) {
  const ids = Array.from({ length: 22 }, (_, i) => i);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  return ids.slice(0, n).map(id => ({ id, pos: Math.random() < 0.5 ? 'upright' : 'reversed' }));
}

function pickShioriTheme(text) {
  let h = 0;
  for (let i = 0; i < text.length; i++) { h = (h * 31 + text.charCodeAt(i)) >>> 0; }
  if (text.length === 0) h = Math.floor(Math.random() * 1000);
  return SHIORI_THEMES[h % SHIORI_THEMES.length];
}

function cardMeaning(card, pos) { return pos === 'upright' ? card.upright : card.reversed; }

// ── Template mode ──
function shioriItemText(theme, index, total) {
  if (total === 1) return theme.cause + theme.flow;
  if (index === 0) return theme.cause;
  if (index === 1) return theme.flow;
  return theme.advice;
}

function generateTemplateCore(acc, planKey, consult, cards, theme) {
  const quote = extractQuote(consult);
  const labels = acc.itemLabels[planKey];
  const lines = [];
  if (acc.secretLine) { lines.push(acc.secretLine); lines.push(''); }
  lines.push(pick(acc.openings).replace('{quote}', quote));
  lines.push(acc.empathyLine);
  lines.push('');
  labels.forEach((label, i) => {
    if (acc.usesCards) {
      const c = cards[i];
      const card = CARDS[c.id];
      const posLabel = c.pos === 'upright' ? '正位置' : '逆位置';
      lines.push('■ ' + label + '｜カード: ' + card.name + '（' + posLabel + '）');
      lines.push(cardMeaning(card, c.pos));
    } else {
      lines.push('■ ' + label);
      if (planKey === 'deep') {
        lines.push(SHIORI_AREA_TEXT[label]);
      } else {
        lines.push(shioriItemText(theme, i, labels.length));
      }
    }
    lines.push('');
  });
  if (planKey === 'deep') {
    lines.push('■ ' + acc.deepExtraLabel);
    lines.push(acc.deepExtraText);
    lines.push('');
  } else if (planKey === 'main') {
    if (acc.usesCards) {
      lines.push('■ 道すじのまとめ');
      lines.push('3枚をつなげて視ると、いまは流れが止まっているのではなく、切り替わる途中にあると読み取れます。焦って結論を出すより、まずご自身の心を整えることが、次の一歩を自然にしてくれる流れです。');
    } else {
      lines.push('■ 30日の整え方指針');
      lines.push(acc.deepExtraText);
    }
    lines.push('');
  }
  lines.push(acc.summary.replace('{quote}', quote));
  lines.push('');
  lines.push(pick(acc.closings));
  return lines.join('\n');
}

function buildAIPrompt(acc, planKey, consult, cards, theme) {

  const labels = acc.itemLabels[planKey];
  let itemsDesc;
  if (acc.usesCards) {
    itemsDesc = labels.map((label, i) => {
      const c = cards[i]; const card = CARDS[c.id]; const posLabel = c.pos === 'upright' ? '正位置' : '逆位置';
      return (i + 1) + '. 「' + label + '」→ カード: ' + card.name + '（' + posLabel + '） 基本の意味: ' + cardMeaning(card, c.pos);
    }).join('\n');
  } else if (planKey === 'deep') {
    itemsDesc = labels.map((label, i) => (i + 1) + '. 「' + label + '」→ 参考: ' + SHIORI_AREA_TEXT[label]).join('\n');

  } else {
    itemsDesc = labels.map((label, i) => (i + 1) + '. 「' + label + '」').join('\n') + '\n※相談文全体から運の詰まりポイントをひとつ診断し、①原因→②今の流れ→③今日からの整え方の順で展開してください。';
  }

  const targetLine = plan.approx ? ('目安は' + plan.target + '字程度です。') : (plan.target + '字以上を目指してください。');

  let rules = acc.key === 'kuroi'
    ? '・略奪成就を断定しない。お相手のご家族への言及、不幸を願う表現はしない。「バレる」等の恐怖を煽る表現も使わない\n・冒頭に必ず秘密厳守の一文を入れること（例:「このやりとりが外に出ることはありません。」）'
    : (acc.key === 'shiori' ? '・祈祷・お祓い・開運グッズ等の物品販売や購入への誘導は一切しない。科学的根拠を偽装する表現（脳科学で証明 等）も使わない' : '');

  const headingBlocks = labels.map(l => '■ ' + l + (acc.usesCards ? '｜カード: (該当カードと正逆位置を明記)' : '') + '\n（読み解き）').join('\n\n');
  let deepExtra = '';
  if (planKey === 'deep') deepExtra = '\n\n■ ' + acc.deepExtraLabel + '\n（30日間の指針）';
  else if (planKey === 'main') deepExtra = acc.usesCards
    ? '\n\n■ 道すじのまとめ\n（3問の答えを重ねて、全体の流れと「ここからどう進んでいくか」を4〜6行でつなげて書く。新しい断定はしない）'
    : '\n\n■ 30日の整え方指針\n（お金のかからない、30日間続けられる整え方の指針を3〜4行で）';

  return acc.aiPersona + '\n\n' +
'【絶対に守るルール】\n' +
'・未来を断定しない。「絶対」「必ず」「100%」「確実」は使用禁止。「〜の流れがあります」「〜しやすい時期です」「〜可能性が高いです」等の言い回しを使うこと\n' +
'・煽らない・脅さない・引き止めない。不安を煽る表現や期限を焦らせる表現は使わない\n' +
'・医療・法律・投資の助言はしない。深刻な内容（自傷・多額の負債・脅迫等）が含まれる場合は、鑑定を続ける前に専門窓口への相談を案内して締めること\n' +
(rules ? rules + '\n' : '') +
'\n【相談文】\n' + consult + '\n\n' +
'【今回の鑑定内容】\n' + itemsDesc + '\n\n' +
'【出力フォーマット】\n' + targetLine + '\n' +
'以下の構成・見出し表記で出力してください（■を使った見出し、項目の前後に空行）。誘導文・アップセルの案内は絶対に書かないでください（こちらで別途付与します）。\n\n' +
'（冒頭2〜4行: 相談文の固有の状況や言葉を引用しながらの共感・受け止め）\n\n' +
headingBlocks + deepExtra + '\n\n' +
'（最後に: 上記の理由の要約 一文＋安心の一文で締める。安心の一文の例:「この鑑定はここで終わりです」「信じるかどうかはあなた次第です」等のニュアンスを、あなたの口調で）';
}

async function callGemini(prompt) {
  const apiKey = getApiKey();
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + CONFIG.GEMINI_MODEL + ':generateContent?key=' + apiKey;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 4096, temperature: 0.8 },
      safetySettings: [
        { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' }
      ]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || ('HTTP ' + res.status));
  }
  const data = await res.json();
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  return parts.map(p => p.text || '').join('');
}

function buildContinuePrompt() {
  const acc = ACCOUNTS[state.account];
  const plan = PLANS[state.plan];
  const consult = document.getElementById('consult-text').value.trim();
  return acc.aiPersona + '\n\n' +
    '以下はここまで書いた鑑定文です。まだ目標文字数（' + plan.target + '字以上）に届いていません。同じトーン・構成を保ったまま、内容を薄めず具体性を足す形で、追加の段落を書いてください。見出しの重複や「以上です」等の締めの繰り返しは避け、自然につながる追加本文のみを出力してください。\n\n' +
    '【相談文】\n' + consult + '\n\n【ここまでの鑑定文】\n' + state.coreText;
}

// ── Generate ──
async function generate() {
  const consult = document.getElementById('consult-text').value.trim();
  if (!consult) { alert('相談文を入力してください'); return; }
  const acc = ACCOUNTS[state.account];
  const planKey = state.plan;
  const labels = acc.itemLabels[planKey];

  let cards = null, theme = null;
  if (acc.usesCards) {
    cards = drawCards(labels.length);
    state.cards = cards;
  } else if (planKey !== 'deep') {
    theme = pickShioriTheme(consult);
    state.theme = theme;
  }

  const btn = document.getElementById('generate-btn');
  btn.disabled = true; btn.classList.add('loading'); btn.textContent = '生成中...';

  try {
    let core;
    if (state.mode === 'ai') {
      const apiKey = getApiKey();
      if (!apiKey) { openSettings(); return; }
      core = await callGemini(buildAIPrompt(acc, planKey, consult, cards, theme));
    } else {
      core = generateTemplateCore(acc, planKey, consult, cards, theme);
    }
    state.coreText = core.trim();
    finalizeOutput();
  } catch (e) {
    alert('生成中にエラーが発生しました:\n' + e.message);
  } finally {
    btn.disabled = false; btn.classList.remove('loading'); btn.textContent = '鑑定文を作る';
  }
}

async function continueWriting() {
  if (state.mode !== 'ai') return;
  const apiKey = getApiKey();
  if (!apiKey) { openSettings(); return; }
  const btn = document.getElementById('continue-btn');
  btn.disabled = true; btn.textContent = '追記中...';
  try {
    const more = await callGemini(buildContinuePrompt());
    state.coreText = state.coreText.trim() + '\n\n' + more.trim();
    finalizeOutput();
  } catch (e) {
    alert('追記中にエラーが発生しました:\n' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '続きを追記する（AI）';
  }
}

function buildUpsellBlock(acc, planKey) {
  const u = acc.upsell;
  let body;
  if (planKey === 'deep') {
    body = u.final;
  } else if (planKey === 'main') {
    body = u.complete + '\n\n' + u.toDeep.replace('{URL}', CONFIG.URLS.TO_DEEP);
  } else {
    body = u.complete + '\n\n' + u.toMain.replace('{URL}', CONFIG.URLS.TO_MAIN);
  }
  return '■ 最後に\n\n' + body;
}

function finalizeOutput() {
  const acc = ACCOUNTS[state.account];
  const upsell = buildUpsellBlock(acc, state.plan);
  const full = state.coreText.trim() + '\n\n' + upsell;
  document.getElementById('output-text').value = full;
  document.getElementById('output-mode-tag').textContent = state.mode === 'ai' ? 'AI生成' : 'テンプレート';
  const area = document.getElementById('output-area');
  area.classList.add('visible');
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('copy-msg').classList.add('hidden');
  updateCounters();
}

// ── Counters / warnings ──
function updateCounters() {
  const text = document.getElementById('output-text').value;
  const count = Array.from(text).length;
  const plan = PLANS[state.plan];
  const met = plan.approx ? count >= 250 : count >= plan.target;
  const label = plan.approx
    ? ('現在' + count + '文字／目安' + plan.target + '字')
    : ('現在' + count + '文字／目標' + plan.target + '字以上');
  const counterEl = document.getElementById('char-counter');
  counterEl.textContent = label;
  counterEl.className = 'char-counter ' + (met ? 'counter-ok' : 'counter-bad');

  const banned = BANNED_WORDS.filter(w => text.includes(w));
  const bannedEl = document.getElementById('banned-warning');
  if (banned.length) {
    bannedEl.style.display = 'block';
    bannedEl.textContent = '⚠️ 断定語が含まれています。修正してください。（該当: ' + banned.join('、') + '）';
  } else {
    bannedEl.style.display = 'none';
  }

  document.getElementById('url-warning').style.display = text.includes('【') ? 'block' : 'none';
  document.getElementById('continue-btn').style.display = (state.mode === 'ai' && !met) ? 'block' : 'none';
}

// ── Copy / Reset ──
function showCopyMsg(msg) {
  const el = document.getElementById('copy-msg');
  el.textContent = msg || 'コピーしました';
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2000);
}

function copyOutput() {
  const text = document.getElementById('output-text').value;
  navigator.clipboard.writeText(text).then(() => showCopyMsg('コピーしました')).catch(() => {
    showCopyMsg('コピーに失敗しました。手動で選択してください。');
  });
}

function resetOutput() {
  hideOutput();
  document.getElementById('consult-text').value = '';
  updateGenerateBtn();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Settings ──
function getApiKey() { return localStorage.getItem('mikazuki_gemini_key') || ''; }

function openSettings() {
  document.getElementById('api-key-input').value = getApiKey();
  document.getElementById('api-status').textContent = '';
  document.getElementById('api-status').className = 'api-status';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeSettings() { document.getElementById('modal-overlay').classList.remove('open'); }
function onOverlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeSettings(); }

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) { clearApiKey(); return; }
  localStorage.setItem('mikazuki_gemini_key', key);
  document.getElementById('settings-btn').classList.add('has-key');
  const st = document.getElementById('api-status');
  st.textContent = '保存しました'; st.className = 'api-status ok';
  document.getElementById('no-key-warn').style.display = 'none';
  setTimeout(closeSettings, 800);
}

function clearApiKey() {
  localStorage.removeItem('mikazuki_gemini_key');
  document.getElementById('api-key-input').value = '';
  document.getElementById('settings-btn').classList.remove('has-key');
  const st = document.getElementById('api-status');
  st.textContent = 'APIキーを削除しました'; st.className = 'api-status err';
  if (state.mode === 'ai') document.getElementById('no-key-warn').style.display = 'block';
}

// ── Boot ──
updateItemsPreview();
if (getApiKey()) document.getElementById('settings-btn').classList.add('has-key');
</script>
